<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 배경 다크 그라데이션 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="60%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#020617" />
    </radialGradient>

    <!-- 외곽 네온 링 그라데이션 -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f59e0b" />
      <stop offset="50%" stopColor="#6366f1" />
      <stop offset="100%" stopColor="#ec4899" />
    </linearGradient>

    <!-- 화살표 골드 그라데이션 -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#b45309" />
      <stop offset="50%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#fffbeb" />
    </linearGradient>

    <!-- 중앙 코어 그라데이션 -->
    <radialGradient id="centerCore" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#334155" />
      <stop offset="100%" stopColor="#090d16" />
    </radialGradient>

    <!-- 그림자 필터 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" floodColor="#000000" floodOpacity="0.8" />
    </filter>
  </defs>

  <!-- 다이얼 외곽 배경 원 -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.85" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 6" />

  <!-- 루틴 세그먼트 아크들 (데모 시각화) -->
  <!-- 09:00 ~ 12:00 파랑 -->
  <path d="M 378 134 A 172 172 0 0 1 428 256 L 368 256 A 112 112 0 0 0 336 176 Z" fill="#3b82f6" opacity="0.9" filter="url(#glow)" />
  <!-- 12:00 ~ 13:30 에메랄드 -->
  <path d="M 428 256 A 172 172 0 0 1 378 378 L 336 336 A 112 112 0 0 0 368 256 Z" fill="#10b981" opacity="0.9" />
  <!-- 13:30 ~ 18:00 인디고 -->
  <path d="M 378 378 A 172 172 0 0 1 134 378 L 176 336 A 112 112 0 0 0 336 336 Z" fill="#6366f1" opacity="0.9" />
  <!-- 18:00 ~ 21:00 로즈 -->
  <path d="M 134 378 A 172 172 0 0 1 84 256 L 144 256 A 112 112 0 0 0 176 336 Z" fill="#f43f5e" opacity="0.9" />
  <!-- 21:00 ~ 23:00 퍼플 -->
  <path d="M 84 256 A 172 172 0 0 1 134 134 L 176 176 A 112 112 0 0 0 144 256 Z" fill="#8b5cf6" opacity="0.9" />
  <!-- 07:00 ~ 09:00 앰버 -->
  <path d="M 256 84 A 172 172 0 0 1 378 134 L 336 176 A 112 112 0 0 0 256 144 Z" fill="#f59e0b" opacity="0.95" />

  <!-- 중앙 코어 디스크 -->
  <circle cx="256" cy="256" r="104" fill="url(#centerCore)" stroke="#475569" stroke-width="3" filter="url(#glow)" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.4" />

  <!-- 중앙 브랜드 텍스트 "24" & "DailyClock" -->
  <text x="256" y="244" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#f8fafc" letter-spacing="-1">24</text>
  <text x="256" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f59e0b" letter-spacing="1">DAILY CLOCK</text>

  <!-- 롱 쉐브론 화살촉 인디케이터 (10시 10분 방향) -->
  <g transform="rotate(55, 256, 256)">
    <polygon points="256,128 244,166 256,156 268,166" fill="url(#arrowGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)" />
    <line x1="256" y1="130" x2="256" y2="155" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>

